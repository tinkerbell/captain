# Tinkerbell's Tootles serves EC2-compatible metadata (as CAPT/CABPK expect).
# The provisioning workflow may override metadata_urls with Tootles' address.
datasource_list: [ Ec2, NoCloud, None ]
datasource:
  Ec2:
    strict_id: false
    metadata_urls: [ "http://169.254.169.254" ]
    # Don't stall boot for minutes (default max_wait is 240s) where there is no metadata service.
    max_wait: 30
    timeout: 5
warnings:
  dsid_missing_source: off
