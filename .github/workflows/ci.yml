name: For each commit and PR
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read
  packages: write

env:
  FORCE_COLOR: "1"
  CAPTAIN_VERBOSE: "1"
  # Build cache (OCI artifacts in ghcr.io); read via the docker/login-action credentials.
  # Scope (downstream/upstream, push or not) is detected from the GitHub context.

jobs:
  # -------------------------------------------------------------------
  # Lint — ruff (lint + format) and pyright (type checking).
  # Doubles as the "prepare" job: resolves dynamic version tokens once
  # (latest kernel.org release of the branch; armbian-next Release ETag)
  # and exposes them as outputs consumed by the build jobs; also decides
  # whether this run may push to the build cache (docs/build-caching.md).
  # -------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      kernel_version: ${{ steps.versions.outputs.kernel_version }}
      cache_push: ${{ steps.cache.outputs.cache_push }}
      armbian_version: ${{ steps.versions.outputs.armbian_version }}
      matrix: ${{ steps.flavors.outputs.matrix }}
      matrix_combined: ${{ steps.flavors.outputs.matrix_combined }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Install lint tools
        run: make lint-install

      - name: Lint
        run: make lint

      - name: Resolve dynamic version tokens
        id: versions
        run: uv run captain prepare-versions >> "$GITHUB_OUTPUT"

      - name: Detect build cache scope
        id: cache
        run: uv run captain cache info --github-output >> "$GITHUB_OUTPUT"

      - name: Build matrices from the flavor registry (captain/flavors.py)
        id: flavors
        run: |
          uv run captain list-flavors
          uv run captain list-flavors --github-output >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  # Build Docker builder image, per-arch; pushes to ghcr.io. A no-op when
  # this repo's or upstream's registry already has it (checked, not pulled).
  # -------------------------------------------------------------------
  build-dockerfile:
    needs: [ prepare ]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: { arch: [ amd64, arm64 ] }
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Dockerfile
        run: uv run captain builder --ensure-remote
        # only if a PR, since we don't want to push images for PRs from forks
        if: github.event_name == 'pull_request'

      - name: Build Dockerfile and push
        run: uv run captain builder --push --ensure-remote
        # only if not a PR, since we don't want to push images for PRs from forks (no perms to push)
        if: github.event_name != 'pull_request'

  # -------------------------------------------------------------------
  # Cache warmer: tools (containerd, runc, nerdctl, CNI plugins), used by
  # every flavor. Restores from, or downloads and pushes to, the build cache,
  # so the build jobs below find them there. Only useful when this run may
  # push; otherwise the build jobs just download what they miss.
  # -------------------------------------------------------------------
  download-tools:
    needs: [ prepare ]
    if: needs.prepare.outputs.cache_push == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, arm64 ]
    env:
      ARCH: ${{ matrix.arch }}
      TOOLS_MODE: native
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tools (or restore them from the cache)
        run: uv run captain tools

  # -------------------------------------------------------------------
  # Build every flavor; mkosi outputs and ISOs come from the build cache
  # when their inputs are unchanged (then tools and kernel aren't needed).
  # The CaptainOS kernel (trixie-slim only) is restored or built (and
  # pushed) by the flavor's own job, so no other flavor waits for it.
  # -------------------------------------------------------------------
  build-captainos:
    name: "build-captainos ${{ matrix.FLAVOR_ID }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: [ prepare, download-tools, build-dockerfile ]
    # The tools warmer is skipped when this run can't push; build anyway.
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ARCH: ${{ matrix.arch }}
      MKOSI_MODE: docker
      ISO_MODE: docker
      FLAVOR_ID: ${{ matrix.FLAVOR_ID }}
      # Latest-of-branch kernel (trixie-slim) and armbian-next repo token
      # (armbian flavors), resolved once by the prepare job.
      KERNEL_VERSION: ${{ needs.prepare.outputs.kernel_version }}
      ARMBIAN_VERSION: ${{ needs.prepare.outputs.armbian_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On main, a release image of these exact outputs may already exist (content tag): then
      # there's nothing to build or restore, and publishing just adds this commit's tag.
      - name: Check whether already published
        id: release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TARGET: ${{ matrix.arch }}
        run: uv run captain release status --github-output >> "$GITHUB_OUTPUT"

      - name: Build (or restore from the cache)
        if: steps.release.outputs.published != 'true'
        run: uv run captain build # full build, incl initramfs and iso when appropriate

      # -------------------------------------------------------------------
      # Publish per-arch artifacts and compute checksums
      # -------------------------------------------------------------------
      - name: Publish artifacts to GHCR
        # only pushes to main, and not PR workflows, should try to push to OCI registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TARGET: ${{ matrix.arch }}
        run: uv run captain release publish

  # -------------------------------------------------------------------
  # Publish combined multi-arch image (reuses per-arch registry blobs).
  # Both arches' outputs come from the build cache, which the build jobs
  # just filled; --cache-only makes sure nothing is rebuilt here. Skipped
  # when the combined image of these outputs is already published.
  # -------------------------------------------------------------------
  publish-combined:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix_combined) }}
    name: "publish-combined ${{ matrix.combined_flavor }}"
    runs-on: ubuntu-latest
    needs: [ prepare, build-captainos ] # prepare: for the matrix; all flavors built
    env:
      FLAVOR_ID: ${{ matrix.combined_flavor }}
      KERNEL_VERSION: ${{ needs.prepare.outputs.kernel_version }}
      ARMBIAN_VERSION: ${{ needs.prepare.outputs.armbian_version }}
      CAPTAIN_CACHE_ONLY: "1"
      TARGET: combined
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load shared config
        run: cat .github/config.env >> "$GITHUB_ENV"

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether already published
        id: release
        env:
          ARCH: amd64
        run: uv run captain release status --github-output >> "$GITHUB_OUTPUT"

      - name: Restore amd64 outputs from the cache
        if: steps.release.outputs.published != 'true'
        run: uv run captain --arch amd64 build

      - name: Restore arm64 outputs from the cache
        if: steps.release.outputs.published != 'true'
        run: uv run captain --arch arm64 build

      - name: Publish combined image to GHCR
        env:
          ARCH: amd64
        run: uv run captain release publish

  # -------------------------------------------------------------------
  # Forks only: every push to main gets a version, v0.0.0-ci.<run number>,
  # so consumers have a stable, monotonically increasing one to bump to.
  # By default just OCI tags (consumers use the images, eg. as k8s image
  # volumes); set the repo variable CAPTAIN_FORK_GH_RELEASE=true to also
  # get a GitHub prerelease with every flavor's artifacts (much slower).
  # Upstream keeps releasing from manually pushed v* tags (release.yml).
  # -------------------------------------------------------------------
  release:
    name: "release v0.0.0-ci.${{ github.run_number }}"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository != 'tinkerbell/captain'
    needs: [ build-captainos, publish-combined ]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: v0.0.0-ci.${{ github.run_number }}
      sha: ${{ github.sha }}
      prerelease: true
      github-release: ${{ vars.CAPTAIN_FORK_GH_RELEASE == 'true' }}
