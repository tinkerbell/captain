name: Release
on:
  # Upstream: real releases, from manually pushed tags.
  push:
    tags:
      - "v**"
  # Forks: automatic versions from ci.yml (v0.0.0-ci.<run_number>): OCI tags only, unless
  # github-release is set (repo variable CAPTAIN_FORK_GH_RELEASE=true).
  workflow_call:
    inputs:
      version:
        description: "Release version / tag to create, eg. v0.0.0-ci.123"
        required: true
        type: string
      sha:
        description: "Commit whose CI-published images to release"
        required: true
        type: string
      prerelease:
        type: boolean
        default: false
      github-release:
        description: "Also create a GitHub Release with every flavor's artifacts (slow); else OCI tags only"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  FORCE_COLOR: "1"
  CAPTAIN_VERBOSE: "1"
  VERSION: ${{ inputs.version || github.ref_name }}
  # Selects the images CI published for this commit (v0.0.0-<sha7>-<flavor>[-<arch>]).
  GIT_SHA: ${{ inputs.sha || github.sha }}
  # Tag pushes (no inputs) always get a GitHub Release.
  GITHUB_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || inputs.github-release }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Flavors are pulled one at a time, but some (disk images) are big: make room first.
      # Only on GitHub-hosted runners; never touch a self-hosted runner's toolchains.
      - name: Free disk space (GitHub-hosted runners only)
        if: runner.environment == 'github-hosted' && env.GITHUB_RELEASE == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_SHA }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load shared config
        run: cat .github/config.env >> "$GITHUB_ENV"

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Create GitHub Release
        if: env.GITHUB_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" --target "${GIT_SHA}" --title "${VERSION}" --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}

      # One flavor at a time, so the runner's disk only ever holds a single flavor's artifacts.
      - name: Pull, pack and upload release artifacts
        if: env.GITHUB_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=out/release-artifacts
          # one line per flavor in the registry (captain/flavors.py): <id> <target> <arch> <tag-suffix>
          uv run captain list-flavors --release | while read -r flavor target arch _suffix; do
            rm -rf "${dir}"
            uv run captain --flavor-id "${flavor}" --arch "${arch}" release --target "${target}" pull --pull-output release-artifacts < /dev/null
            for d in "${dir}"/*/; do
              [[ -d "${d}" ]] || continue
              echo "Creating tarball for '${d}'"
              tar -C "${dir}" -czf "${d%/}.tar.gz" "$(basename "${d}")"
              rm -rf "${d}"
            done
            gh release upload "${VERSION}" "${dir}"/* --clobber < /dev/null
            rm -rf "${dir}"
            df -h / | tail -1
          done

      # Manifest re-tags in the registry (no Docker): seconds.
      - name: Tag all flavors
        run: |
          # tag suffixes are kept stable for already-published flavors (eg "" for trixie-full, "-slim", "-rpi")
          uv run captain list-flavors --release | while read -r flavor _target arch suffix; do
            uv run captain --flavor-id "${flavor}" --arch "${arch}" release tag --new-tag "${VERSION}${suffix}" < /dev/null
          done
