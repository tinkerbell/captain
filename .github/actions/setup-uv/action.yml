name: Set up uv
description: >-
  astral-sh/setup-uv with everything cached in the GitHub Actions cache, so jobs don't
  re-download uv, CPython or Python packages: the uv binary (via the runner's tool cache),
  the uv-managed CPython (pinned to one minor for CI), and the downloaded wheels.

inputs:
  uv-version:
    description: uv version to install (pinned, so cache keys and behaviour are stable).
    default: "0.13.6"
  python-version:
    description: Python version for UV_PYTHON (CI only; local builds pick their own).
    default: "3.13"
  cache-suffix:
    description: Bump to start new caches, eg. to pick up newer dependency versions.
    default: "v1"

runs:
  using: composite
  steps:
    # setup-uv looks in the runner's tool cache before downloading uv. Caching skipped for the
    # events setup-uv's `enable-cache: auto` skips (cache poisoning): releases, tag pushes,
    # pull_request_target, workflow_run.
    - name: Restore the uv binary
      if: >-
        github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') &&
        github.event_name != 'pull_request_target' && github.event_name != 'workflow_run'
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/uv/${{ inputs.uv-version }}
        key: uv-binary-${{ runner.os }}-${{ runner.arch }}-${{ inputs.uv-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: auto
        cache-python: true
        # uv.lock is gitignored (always the latest dependencies): key on the declared ones.
        cache-dependency-glob: pyproject.toml
        prune-cache: false
        cache-suffix: ${{ inputs.cache-suffix }}
